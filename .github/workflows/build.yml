# Builds the bridge once (Stable ABI) and runs every test with every Python,
# 3.9 to 3.13, on Linux. ooRexx comes from its portable build on SourceForge,
# pinned to one revision; a newer one is taken deliberately, after checking it.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OOREXX_REV: "13268"
  OOREXX_URL: https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable
  OOREXX_PKG: ubuntu2404.x86_64
  PYTHONS: "3.9 3.10 3.11 3.12 3.13"

jobs:
  linux:
    name: linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.$OOREXX_PKG-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.$OOREXX_PKG-portable-release/bin" >> "$GITHUB_PATH"
      - run: rexx -v
      - name: Python ${{ env.PYTHONS }}, with numpy and matplotlib
        run: |
          scripts/setup-pythons.sh
          export UV_PYTHON_INSTALL_DIR=$(cd .. && pwd)/pythons
          for v in $PYTHONS; do
            uv pip install -q --python "$(uv python find $v)" --break-system-packages numpy matplotlib
          done
      - name: ooRexxUnit
        run: |
          sudo apt-get install -y -q subversion >/dev/null
          scripts/setup-oorexxunit.sh
      - name: Build
        run: scripts/build.sh
      - name: Tests
        run: OUT=$RUNNER_TEMP/tests tests/run.sh
      - name: Heavy threads stress test (3.9 and 3.13)
        run: OUT=$RUNNER_TEMP/tests-heavy PYTHONS="3.9 3.13" TESTS=Threads.testGroup ORXPY_THREADS="16 16 2000" TIMEOUT=600 tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: ${{ runner.temp }}/tests*
