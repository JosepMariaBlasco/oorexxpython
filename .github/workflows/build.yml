# Builds the bridge once (Stable ABI) and runs every test with every Python,
# 3.9 to 3.15, on Linux, macOS (arm64 and x64) and Windows. ooRexx comes from its portable
# builds on SourceForge, pinned to one revision; a newer one is taken
# deliberately, after checking it (the ooRexx bridges move together). The
# minimum is ooRexx 5.3.0 r13297, the revision this runs on (the ooRexx bridges'; logicalwrapper.cls
# since r13278, the fix for #2122 since r13286).
#
# Each platform's build is then packaged as a zip of binaries
# (scripts/package.sh; artifacts oorexxpython-<platform>), which is checked
# unzipped, as a user would install it, with the system's own Python: first
# with the environment variables, then installed into ooRexx by install.rex
# (and uninstalled). The Windows zip and the books also make the Windows
# installer (windows-installer job: NSIS), tried with ooRexx's own installer.
# A tag vX.Y.Z[-suffix] (git tag v0.1.0 && git push origin v0.1.0) also makes
# a GitHub release with the four zips, the Windows installer and the books
# (two PDFs, two zips of HTML: the books job); pushes to main publish nothing.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  OOREXX_REV: "13297"
  OOREXX_URL: https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable
  PYTHONS: "3.9 3.10 3.11 3.12 3.13 3.14 3.15"

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            oorexx: ubuntu2404.x86_64
          - name: macos-arm64
            os: macos-14
            oorexx: macos.arm64.x86_64
          # Intel: the last x86_64 macOS image GitHub offers (until fall 2027);
          # ooRexx's macOS portable build is universal
          - name: macos-x64
            os: macos-15-intel
            oorexx: macos.arm64.x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release/bin" >> "$GITHUB_PATH"
      - name: macOS tools (coreutils' timeout)
        if: runner.os == 'macOS'
        run: brew install -q coreutils
      - run: rexx -v
      - name: The samples' slide deck is up to date
        if: runner.os == 'Linux'
        run: |
          rexx scripts/samples-deck.rex
          git diff --exit-code samples/slides || { echo "run scripts/samples-deck.rex and commit samples/slides"; exit 1; }
      - name: Python ${{ env.PYTHONS }}, with numpy, matplotlib and pandas
        run: |
          scripts/setup-pythons.sh
          export UV_PYTHON_INSTALL_DIR=$(cd .. && pwd)/pythons
          for v in $PYTHONS; do
            uv pip install -q --python "$(uv python find $v)" --break-system-packages numpy matplotlib pandas
            # matplotlib builds its font cache on first use and says so on
            # stderr, which a sample's output check would see
            "$(uv python find $v)" -c "import matplotlib.pyplot"
          done
      - name: ooRexxUnit
        run: scripts/setup-oorexxunit.sh
      - name: Build
        run: scripts/build.sh
      - name: Tests
        run: OUT=$RUNNER_TEMP/tests tests/run.sh
      - name: Heavy threads stress test (3.9 and 3.15)
        run: OUT=$RUNNER_TEMP/tests-heavy PYTHONS="3.9 3.15" TESTS=Threads.testGroup ORXPY_THREADS="16 16 2000" TIMEOUT=600 tests/run.sh
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export ORXPY_VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/package.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: oorexxpython-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*.zip
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: The package, unzipped, with the system's Python
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          unzip -q "$RUNNER_TEMP"/dist/*.zip
          D=$PWD/oorexxpython
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_LIBRARY_PATH=$D; else export LD_LIBRARY_PATH=$D; fi
          export REXX_PATH=$D PYTHONPATH=$D
          PY=$(command -v python3); [ "$RUNNER_OS" = Linux ] && PY=/usr/bin/python3
          "$PY" -c "import sys, sysconfig; print(sys.version, sysconfig.get_config_var('LDLIBRARY'))"
          cd .. && ORX_PYTHON=$PY rexx "$D/check.rex" && "$PY" "$D/check.py"
      - name: The package, installed into ooRexx (rexx install), with no variables
        run: |
          cd "$RUNNER_TEMP/try/oorexxpython"
          # Ubuntu's own Python: its site-packages belongs to root, so --user
          PY=$(command -v python3); OPT=; [ "$RUNNER_OS" = Linux ] && { PY=/usr/bin/python3; OPT=--user; }
          rexx install --python "$PY" $OPT
          rexx install status
          # the unzipped folder is no longer needed: the uninstaller and the
          # samples are in ooRexx's folders
          cd "$RUNNER_TEMP" && rm -rf "$RUNNER_TEMP/try/oorexxpython"
          BIN=$(dirname "$(command -v rexx)")
          S=$(dirname "$BIN")/samples/python
          test -f "$S/01-hello.rex" && test -f "$S/slides/samples.html"
          ORX_PYTHON=$PY rexx "$S/01-hello.rex" && "$PY" "$S/30-run-rexx.py"
          rexx oorexxpython-uninstall status
          rexx oorexxpython-uninstall
          if "$PY" -c "import oorexx" 2>/dev/null; then echo "oorexx still importable"; exit 1; fi
          test ! -e "$BIN/python.cls" && test ! -e "$BIN/boolean.cls" && test ! -e "$BIN/oorexxpython-uninstall.rex" && test ! -e "$S"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/tests*

  # The same scripts, in Git Bash, with MSVC's developer environment
  windows:
    name: windows-x64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.windows.x86_64-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.windows.x86_64-portable-release/bin" >> "$GITHUB_PATH"
      - run: rexx -v
      - name: Python ${{ env.PYTHONS }}, with numpy, matplotlib and pandas
        run: |
          scripts/setup-pythons.sh
          export UV_PYTHON_INSTALL_DIR=$(cygpath -w "$(cd .. && pwd)/pythons")
          for v in $PYTHONS; do
            uv pip install -q --python "$(uv python find $v)" --break-system-packages numpy matplotlib pandas
            "$(uv python find $v)" -c "import matplotlib.pyplot"
          done
      - name: ooRexxUnit
        run: scripts/setup-oorexxunit.sh
      - name: Build
        run: scripts/build.sh
      - name: Tests
        run: OUT=$RUNNER_TEMP/tests tests/run.sh
      - name: Heavy threads stress test (3.9 and 3.15)
        run: OUT=$RUNNER_TEMP/tests-heavy PYTHONS="3.9 3.15" TESTS=Threads.testGroup ORXPY_THREADS="16 16 2000" TIMEOUT=600 tests/run.sh
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export ORXPY_VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/package.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: oorexxpython-windows-x64
          path: ${{ runner.temp }}/dist/*.zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The package, unzipped, with the system's Python
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          unzip -q "$RUNNER_TEMP"/dist/*.zip
          D=$PWD/oorexxpython
          export PATH="$D:$PATH" REXX_PATH=$(cygpath -w "$D") PYTHONPATH=$(cygpath -w "$D")
          python -c "import sys; print(sys.version, sys.executable)"
          cd .. && rexx "$(cygpath -w "$D/check.rex")" && python "$(cygpath -w "$D/check.py")"
      - name: The package, installed into ooRexx (rexx install), with no variables
        run: |
          cd "$RUNNER_TEMP/try/oorexxpython"
          rexx install
          rexx install status
          # the unzipped folder is no longer needed (see the Unix jobs)
          cd "$RUNNER_TEMP" && rm -rf "$RUNNER_TEMP/try/oorexxpython"
          BIN=$(dirname "$(command -v rexx)")
          S=$(dirname "$BIN")/samples/python
          test -f "$S/01-hello.rex" && test -f "$S/slides/samples.html"
          rexx "$(cygpath -w "$S/01-hello.rex")" && python "$(cygpath -w "$S/30-run-rexx.py")"
          rexx oorexxpython-uninstall status
          rexx oorexxpython-uninstall
          if python -c "import oorexx" 2>/dev/null; then echo "oorexx still importable"; exit 1; fi
          test ! -e "$BIN/rexxpython.dll" && test ! -e "$BIN/oorexxpython-uninstall.rex" && test ! -e "$S"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-windows-x64
          path: ${{ runner.temp }}/tests*

  # The books (docs/books), as PDFs and HTML, with ooRexx's own documentation
  # tools (docs/trunk/tools/bldoc_orx, from ooRexx's SVN) and the Rexx
  # Parser, which highlights their Rexx listings: artifact oorexxpython-docs
  books:
    name: books
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # the tags: the books' version
      - name: DocBook, xsltproc, FOP, Subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion xsltproc docbook-xml docbook-xsl fop fonts-liberation zip >/dev/null
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release/bin" >> "$GITHUB_PATH"
      - name: ooRexx's documentation tools, and the Rexx Parser
        run: |
          U=https://svn.code.sf.net/p/oorexx/code-0/docs/trunk
          mkdir -p "$RUNNER_TEMP/docSVN/tools"
          svn export -q "$U/tools/bldoc_orx" "$RUNNER_TEMP/docSVN/tools/bldoc_orx"
          svn export -q "$U/oorexx" "$RUNNER_TEMP/docSVN/oorexx"
          P=https://rexx.epbcn.com/rexx-parser/
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/parser.zip" "${P}Rexx-Parser-latest.zip"
          mkdir -p "$RUNNER_TEMP/rexx-parser" && unzip -q "$RUNNER_TEMP/parser.zip" -d "$RUNNER_TEMP/rexx-parser"
          test -f "$RUNNER_TEMP/rexx-parser/bin/Rexx.Parser.cls"
      - name: Build the books
        run: |
          DOCS_SVN=$RUNNER_TEMP/docSVN REXX_PARSER=$RUNNER_TEMP/rexx-parser \
          STAGE=$RUNNER_TEMP/books-build OUT=$RUNNER_TEMP/books scripts/build-books.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oorexxpython-docs
          path: |
            ${{ runner.temp }}/books/*.pdf
            ${{ runner.temp }}/books/*-html.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: books-logs
          path: |
            ${{ runner.temp }}/books-build/*.log
            ${{ runner.temp }}/books-build/bldoc/log_files

  # The Windows installer (scripts/windows-installer.sh: NSIS, a wrapper around
  # install.rex), from the Windows zip and the books; then tried as a user
  # would: ooRexx from its own installer, ours silently with two Pythons, the
  # one Rexx uses not the PATH's, and its uninstaller
  windows-installer:
    name: windows-installer
    needs: [windows, books]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: oorexxpython-windows-x64
          path: ${{ runner.temp }}/zip
      - uses: actions/download-artifact@v4
        with:
          name: oorexxpython-docs
          path: ${{ runner.temp }}/docs
      - name: NSIS
        run: |
          if ! command -v makensis && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
      - name: Build the installer
        run: scripts/windows-installer.sh "$RUNNER_TEMP"/zip/*.zip "$RUNNER_TEMP/docs" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: oorexxpython-windows-x64-installer
          path: ${{ runner.temp }}/dist/*.exe
      - name: ooRexx r${{ env.OOREXX_REV }} (its installer, silent)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\oorexx-setup.exe"
          curl.exe -sSfL --retry 3 -o $exe "https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64.exe"
          $p = Start-Process $exe -ArgumentList '/S' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          & "C:\Program Files\ooRexx\rexx.exe" -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (silent), two Pythons, Rexx uses the one not on the PATH
        shell: pwsh
        run: |
          # the PATH a new session has, with ooRexx's folder that its installer added
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
          uv python install 3.13
          $py13 = (uv python find 3.13)
          $py12 = (Get-Command python).Source
          "PY13=$py13" | Out-File -Append $env:GITHUB_ENV
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\dist\*.exe").FullName
          # not Start-Process -Wait: it waits for the descendants too, and rexx.exe
          # leaves ooRexx's rxapi.exe running
          $p = Start-Process $exe -ArgumentList '/S', "/PYTHON=$py12;$py13", "/REXXPYTHON=$py13" -PassThru
          $p.WaitForExit()
          Get-Content "$env:TEMP\oorexxpython-install.log"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Installed, with no variables
        run: |
          R="/c/Program Files/ooRexx"
          export PATH="$R:$PATH"
          unset ORX_PYTHON REXX_PATH PYTHONPATH
          rexx oorexxpython-uninstall status
          cat "$R/oorexxpython.cfg"
          cd "$RUNNER_TEMP"
          printf "say .py~import('sys')~version~word(1)\n::requires 'python.cls'\n" > v.rex
          v=$(rexx v.rex); echo "Rexx uses Python $v"; case $v in 3.13.*) ;; *) exit 1 ;; esac
          python -c "import oorexx; print(oorexx.Interpreter().eval(\"'ok'\"))"
          "$PY13" -c "import oorexx; print(oorexx.Interpreter().eval(\"'ok'\"))"
          rexx "$(cygpath -w "$R/samples/python/01-hello.rex")"
          test -f "$R/doc/pythonref.pdf" && test -f "$R/doc/pythoncookbook.pdf" && test -f "$R/uninstall-oorexxpython.exe"
          SM="/c/ProgramData/Microsoft/Windows/Start Menu/Programs/Open Object Rexx"
          ls -R "$SM" | grep -i python
          test -f "$SM/ooRexx Documentation/ooRexx and Python - Reference.lnk"
          test -f "$SM/ooRexx Samples/ooRexx and Python samples.lnk"
          reg query 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\ooRexxPython' /reg:32
      - name: Uninstall (silent)
        shell: pwsh
        run: |
          $p = Start-Process "C:\Program Files\ooRexx\uninstall-oorexxpython.exe" -ArgumentList '/S', '_?=C:\Program Files\ooRexx' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Remove-Item "C:\Program Files\ooRexx\uninstall-oorexxpython.exe"   # _?= leaves it
      - name: Uninstalled
        run: |
          R="/c/Program Files/ooRexx"
          test ! -e "$R/rexxpython.dll" && test ! -e "$R/oorexxpython.cfg" && test ! -e "$R/doc/pythonref.pdf"
          test ! -e "$R/samples/python" && test ! -e "$R/oorexxpython-uninstall.rex"
          if python -c "import oorexx" 2>/dev/null; then echo "oorexx still importable"; exit 1; fi
          if ls -R "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/Open Object Rexx" | grep -i python; then exit 1; fi
          if reg query 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\ooRexxPython' /reg:32; then exit 1; fi
          test -f "$R/rexx.exe"           # ooRexx itself untouched

  release:
    if: github.ref_type == 'tag'
    needs: [unix, windows, books, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oorexxpython-*
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${pre[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes dist/*.zip dist/*.pdf dist/*.exe
